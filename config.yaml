# Valeurs initiales : les valeurs marquées à vérifier sont des hypothèses, pas des mesures.
site:
  pv_kwc: 2.06
  pv_invest_eur: 1200
  pv_install_date: "2026-03-15" # à confirmer
  timezone: "Europe/Paris"
  pool_pump_w: 1000
  pool_pump_inrush_factor: 5 # protection électrique, pas énergie consommée en régime établi
  gas_cooking_kwh_year: 0 # hypothèse : cuisson négligée, à ajuster si nécessaire
energy_prices:
  # Remplir avec les prix TTC applicables au contrat et à la date analysée.
  tempo_eur_kwh:
    bleu_hp: null
    bleu_hc: null
    blanc_hp: null
    blanc_hc: null
    rouge_hp: null
    rouge_hc: null
  gas_price_eur_kwh: null # à compléter depuis la facture
  gas_kwh_per_m3: null # à compléter selon facture / PCS
  gas_boiler_efficiency: 0.85 # hypothèse à vérifier
  default_electricity_price_eur_kwh: null
tank:
  volume_l: 150
  heater_power_w: 1500
  setpoint_c: 55
  cold_water_temp_c: 12 # hypothèse saisonnière simplifiée
  standby_loss_kwh_day: 1.0 # à vérifier sur fiche technique
  investment_eur: null # ballon + pose + routeur/relais
  lifetime_years: 15
battery:
  capacity_kwh: 1.92
  max_power_w: 800 # à vérifier selon modèle / configuration
  usable_dod: 0.90
  roundtrip_efficiency: 0.90
  standby_w: 2 # hypothèse à vérifier
  lifetime_cycles: 6000 # hypothèse à vérifier
  lifetime_years: 10
  annual_capacity_degradation: 0.02 # hypothèse à vérifier
  investment_eur: null
simulation:
  timestep_minutes: 15
  priority: ["house", "pool", "battery", "tank"]
  scenario_pessimistic:
    surplus_multiplier: 0.75
    ecs_multiplier: 0.75
    battery_efficiency: 0.85
    tank_loss_kwh_day: 1.3
    battery_lifetime_years: 8
    tank_lifetime_years: 12
    gas_growth: 0.0
    electricity_growth: 0.0
  scenario_optimistic:
    surplus_multiplier: 1.15
    ecs_multiplier: 1.20
    battery_efficiency: 0.94
    tank_loss_kwh_day: 0.7
    battery_lifetime_years: 15
    tank_lifetime_years: 15
    gas_growth: 0.03
    electricity_growth: 0.02
